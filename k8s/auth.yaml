apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: student-app
spec:
  selector: {app: auth}
  ports:
    - {port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: student-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: auth}
  template:
    metadata:
      labels: {app: auth}
    spec:
      containers:
        - name: auth
          image: harathi2026/student-auth:3acdc2001fc5ac992d02aded5e4949bf959c19dc
          ports:
            - {containerPort: 8000}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: student-secrets, key: AUTH_DATABASE_URL}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: student-secrets, key: JWT_SECRET}
            - name: DEMO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: student-secrets, key: DEMO_ADMIN_PASSWORD}
            - name: DEMO_STUDENT_PASSWORD
              valueFrom:
                secretKeyRef: {name: student-secrets, key: DEMO_STUDENT_PASSWORD}
            - name: PASSWORD_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: {name: student-secrets, key: PASSWORD_ENCRYPTION_KEY}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
