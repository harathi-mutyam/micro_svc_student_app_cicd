apiVersion: v1
kind: Service
metadata:
  name: attendance
  namespace: student-app
spec:
  selector: {app: attendance}
  ports:
    - {port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance
  namespace: student-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: attendance}
  template:
    metadata:
      labels: {app: attendance}
    spec:
      containers:
        - name: attendance
          image: harathi2026/student-attendance:ad51a5ac9335dadc41812ce52b8cede53e46503c
          ports:
            - {containerPort: 8000}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: student-secrets, key: ATTENDANCE_DATABASE_URL}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: student-secrets, key: JWT_SECRET}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
