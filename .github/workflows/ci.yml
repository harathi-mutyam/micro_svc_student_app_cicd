name: Student App CI - Validate Test Build Scan Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Application Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Validate Python Syntax
        run: |
          python3 -m compileall -q services
          echo 'PASS: Python syntax'

      - name: Validate Bash Scripts
        run: |
          set -euo pipefail
          bash -n database/init.sh
          for script in scripts/*.sh; do
            [ -f "$script" ] || continue
            bash -n "$script"
          done
          echo 'PASS: Bash syntax'

      - name: Validate Kubernetes YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for file in sorted(Path('k8s').rglob('*.yaml')):
              list(yaml.safe_load_all(file.read_text()))
              print('Validated:', file)
          print('PASS: Kubernetes YAML syntax')
          PY

      - name: Validate Dockerfiles
        run: |
          set -euo pipefail
          for svc in auth students attendance marks; do
            test -f "services/$svc/Dockerfile"
          done
          test -f frontend/Dockerfile
          echo 'PASS: Five Dockerfiles found'

  integration_test:
    name: Docker Compose Integration Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Temporary CI Credentials
        run: |
          python3 - <<'PY'
          import secrets
          import base64
          from pathlib import Path
          values = {
              'MYSQL_ROOT_PASSWORD': secrets.token_hex(32),
              'JWT_SECRET': secrets.token_hex(32),
              'DEMO_ADMIN_PASSWORD': secrets.token_urlsafe(24),
              'DEMO_STUDENT_PASSWORD': secrets.token_urlsafe(24),
              'AUTH_DB_PASSWORD': secrets.token_hex(32),
              'STUDENT_DB_PASSWORD': secrets.token_hex(32),
              'ATTENDANCE_DB_PASSWORD': secrets.token_hex(32),
              'MARKS_DB_PASSWORD': secrets.token_hex(32),
              'PASSWORD_ENCRYPTION_KEY': base64.urlsafe_b64encode(secrets.token_bytes(32)).decode(),
          }
          path = Path('.env')
          path.write_text(''.join(f'{k}={v}\n' for k,v in values.items()))
          path.chmod(0o600)
          print('Generated temporary CI credentials (not displayed)')
          PY

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Start Seven Containers
        run: docker compose up -d --build

      - name: Test Four API Services and Admin Login
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path

          base = 'http://127.0.0.1:8080'
          env = dict(line.split('=', 1) for line in Path('.env').read_text().splitlines()
                     if '=' in line and not line.startswith('#'))
          services = ('auth', 'students', 'attendance', 'marks')

          for attempt in range(60):
              try:
                  for svc in services:
                      with urllib.request.urlopen(f'{base}/api/{svc}/health', timeout=5) as response:
                          data = json.load(response)
                      assert data.get('status') == 'ok', (svc, data)
                      assert data.get('service') == svc, (svc, data)
                  print('PASS: Four API health checks')
                  break
              except Exception:
                  if attempt == 59:
                      raise
                  time.sleep(2)

          payload = json.dumps({
              'username': 'admin',
              'password': env['DEMO_ADMIN_PASSWORD'],
          }).encode()
          request = urllib.request.Request(
              f'{base}/api/auth/login', data=payload,
              headers={'Content-Type': 'application/json'}, method='POST'
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              login = json.load(response)
          assert login.get('access_token')
          assert login.get('role') == 'admin'
          print('PASS: Admin login')

          request = urllib.request.Request(
              f'{base}/api/students/',
              headers={'Authorization': f"Bearer {login['access_token']}"}
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              students = json.load(response)
          assert isinstance(students, list)
          print('PASS: Students API')
          print('ALL INTEGRATION TESTS PASSED')
          PY

      - name: Show Container Logs if Failed
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=100

      - name: Remove Temporary Test Environment
        if: always()
        run: docker compose down -v --remove-orphans

  publish:
