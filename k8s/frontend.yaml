apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: student-app
spec:
  selector: {app: frontend}
  ports:
    - {port: 80, targetPort: 80}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: student-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: harathi2026/student-frontend:db75bd0d54811785cc6b892576b1f7f6d1dd5abd
          ports:
            - {containerPort: 80}
          readinessProbe:
            tcpSocket: {port: 80}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 50m, memory: 96Mi}
