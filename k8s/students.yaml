apiVersion: v1
kind: Service
metadata:
  name: students
  namespace: student-app
spec:
  selector: {app: students}
  ports:
    - {port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: students
  namespace: student-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: students}
  template:
    metadata:
      labels: {app: students}
    spec:
      containers:
        - name: students
          image: harathi2026/student-students:8750e1decca3c6c09ed3a02d4b78935ca1c08b22
          ports:
            - {containerPort: 8000}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: student-secrets, key: STUDENTS_DATABASE_URL}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: student-secrets, key: JWT_SECRET}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
