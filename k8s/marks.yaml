apiVersion: v1
kind: Service
metadata:
  name: marks
  namespace: student-app
spec:
  selector: {app: marks}
  ports:
    - {port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marks
  namespace: student-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: marks}
  template:
    metadata:
      labels: {app: marks}
    spec:
      containers:
        - name: marks
          image: harathi2026/student-marks:f33d759444cc22e3dd44692fe7e84bcc322ffe4e
          ports:
            - {containerPort: 8000}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: student-secrets, key: MARKS_DATABASE_URL}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: student-secrets, key: JWT_SECRET}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
