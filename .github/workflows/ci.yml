name: Student CI - Build Scan Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for file in Path('services').rglob('*.py'):
              ast.parse(file.read_text(), filename=str(file))
          print('Python syntax OK')
          PY
      - name: Shell and YAML validation
        run: |
          bash -n database/init.sh scripts/deploy.sh
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import yaml
          from pathlib import Path
          for p in Path('k8s').glob('*.yaml'):
              list(yaml.safe_load_all(p.read_text()))
          print('Kubernetes YAML parsed')
          PY
  publish:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, students, attendance, marks, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'frontend' && './frontend' || '.' }}
          file: ${{ matrix.service == 'frontend' && 'frontend/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/student-${{ matrix.service }}:${{ github.sha }}
      - name: Trivy vulnerability scan (nonblocking demo baseline)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/student-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Publish built image
        run: docker push "${{ secrets.DOCKERHUB_USERNAME }}/student-${{ matrix.service }}:${{ github.sha }}"
